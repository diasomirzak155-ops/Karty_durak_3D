services:
  - type: web
    name: karty-durak-online
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATA_DIR
        value: /var/data
    disk:
      name: durak-data
      mountPath: /var/data
      sizeGB: 1
